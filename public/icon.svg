<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1A1033" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Monogram Stem Gradient -->
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Upper Arm Gradient -->
    <linearGradient id="arm-top-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Lower Arm Gradient -->
    <linearGradient id="arm-bottom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Outer Glow Effect -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="url(#border-grad)" stroke-width="4" opacity="0.4" />

  <!-- Tech Grid Accent Lines -->
  <path d="M 120 400 L 120 440 M 390 120 L 430 120" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Monogram Group -->
  <g filter="url(#glow)">
    <!-- Vertical Bar (Left side of K) -->
    <rect x="130" y="120" width="54" height="272" rx="27" fill="url(#stem-grad)" />

    <!-- Upper Arm (Top Diagonal of K) -->
    <path d="M 195 245 L 320 135 C 332 125, 350 130, 355 145 C 360 160, 350 175, 335 188 L 240 270 Z" fill="url(#arm-top-grad)" />

    <!-- Lower Arm (Bottom Diagonal of K) -->
    <path d="M 225 240 L 335 360 C 348 374, 342 392, 328 396 C 314 400, 298 392, 288 380 L 195 275 Z" fill="url(#arm-bottom-grad)" />

    <!-- Pulsing Tech Node / Dot at Top Right -->
    <circle cx="365" cy="145" r="16" fill="#10B981" />
    <circle cx="365" cy="145" r="8" fill="#FFFFFF" />
  </g>
</svg>